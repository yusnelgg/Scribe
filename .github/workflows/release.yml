name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false

      - name: Build for Linux
        run: |
          go build -o scribe-linux-amd64 ./cmd/scribe
          go build -o scribe-linux-arm64 ./cmd/scribe

      - name: Build for Windows
        run: |
          GOOS=windows GOARCH=amd64 go build -o scribe-windows-amd64.exe ./cmd/scribe

      - name: Build for macOS
        run: |
          GOOS=darwin GOARCH=amd64 go build -o scribe-darwin-amd64 ./cmd/scribe
          GOOS=darwin GOARCH=arm64 go build -o scribe-darwin-arm64 ./cmd/scribe

      - name: List built files
        run: |
          ls -la scribe-*

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            scribe-linux-amd64
            scribe-linux-arm64
            scribe-windows-amd64.exe
            scribe-darwin-amd64
            scribe-darwin-arm64
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}